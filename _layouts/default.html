<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.title | default: "Namlete" }}</title>
    
    <!-- CSS chính -->
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    
    <!-- MathJax để render công thức toán -->
    <script>
    MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true
      },
      svg: {
        fontCache: 'global'
      }
    };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
    <div class="container">
        <!-- Header / Navigation -->
        <header>
            <nav>
                <a href="{{ '/' | relative_url }}">home</a>
                <a href="{{ '/archive' | relative_url }}">archive</a>
                <a href="{{ '/tag' | relative_url }}">tag</a>
                <a href="{{ '/draft' | relative_url }}">draft</a>
            </nav>
        </header>

        <!-- Nội dung chính của từng trang sẽ được chèn vào đây -->
        <main>
            {{ content }}
        </main>

        <!-- Footer -->
        <footer>
            <p>
                <a href="https://github.com/Namlete102">Github</a> . 
                <a href="mailto:your-email@example.com">Contact</a>
            </p>
            <p>&copy; {{ 'now' | date: "%Y" }} Namlete</p>
        </footer>
    </div>
</body>
</html>
