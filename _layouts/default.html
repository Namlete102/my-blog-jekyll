<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}</title>
    <!-- Trỏ về file style.css -->
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    
    <!-- MathJax -->
    <script>
    MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      }
    };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
    <div class="container">
        <!-- Phần Header -->
        <header>
            <h1><a href="{{ '/' | relative_url }}">{{ page.title | default: "Untitled" }}</a></h1>
            <nav>
                <a href="{{ '/' | relative_url }}">home</a>
                <a href="{{ '/archive' | relative_url }}">archive</a>
                <a href="{{ '/tag' | relative_url }}">tag</a>
                <a href="{{ '/draft' | relative_url }}">draft</a>
            </nav>
        </header>

        <!-- Phần Nội dung -->
        <main>
            {{ content }}
        </main>

        <!-- Phần Footer -->
        <footer>
            <div class="footer-links">
                <a href="https://github.com/Namlete102">Github</a> . 
                <a href="mailto:your-email@example.com">Contact</a>
            </div>
            <div class="footer-copy">
                &copy;{{ 'now' | date: "%Y" }} Namlete
            </div>
        </footer>
    </div>
</body>
</html>
