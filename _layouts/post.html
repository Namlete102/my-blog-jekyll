---
layout: default
---
<article class="post">
    <!-- Tiêu đề căn giữa -->
    <h1 class="post-title">{{ page.title }}</h1>
    
    <!-- Ngày tháng và Tags căn giữa -->
    <div class="post-meta">
        <span class="post-date">{{ page.date | date: "%Y-%m-%d" }}</span>
        {% if page.tags.size > 0 %}
            <span class="post-tags">
                {% for tag in page.tags %}
                    {{ tag }}&nbsp;
                {% endfor %}
            </span>
        {% endif %}
    </div>

    <!-- Nội dung bài viết -->
    <div class="post-content">
        {{ content }}
    </div>
</article>
